# @uniccodebot: o'z PostgreSQL bazasi bilan. /opt/uniccode/.env dan o'qiydi.
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: uniccode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da yo'q}
      POSTGRES_DB: uniccode
      TZ: Asia/Tashkent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniccode"]
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: ../..
      dockerfile: uniccode/deploy/Dockerfile
    restart: always
    env_file: ${UNIC_ENV_FILE:-/opt/uniccode/.env}
    environment:
      UNIC_DATABASE_URL: postgresql+asyncpg://uniccode:${POSTGRES_PASSWORD}@db:5432/uniccode
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /opt/uniccode/secrets:/app/secrets:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  pgdata:
